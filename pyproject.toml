[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "launchlens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # data
    "pandas>=2.2",
    "geopandas>=0.14",
    "datagovindia>=0.1.4",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "redis>=5.0",
    # LLM / orchestration
    "anthropic>=0.40",
    "openai>=1.50",          # Sarvam-105B uses OAI-compatible endpoint
    "langgraph>=0.2",
    "jinja2>=3.1",
    # validation / analytics
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "bertopic>=0.16",
    "networkx>=3.3",
    "dtaidistance>=2.3",
    # api / dashboard backend
    "fastapi>=0.111",
    "uvicorn>=0.30",
    # utils
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "diskcache>=5.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
